# Integración continua: en cada push o pull request a GitHub se revisa el estilo del código,
# se compilan los recursos y se ejecutan todas las pruebas contra PostgreSQL.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pac_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, mbstring, intl, gd, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Dependencias de PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Estilo del código (Laravel Pint)
        run: ./vendor/bin/pint --test

      - name: Dependencias de JavaScript y compilación
        run: |
          npm ci
          npm run build

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Auditoría de dependencias de PHP
        run: composer audit

      - name: Pruebas automatizadas
        run: php artisan test
